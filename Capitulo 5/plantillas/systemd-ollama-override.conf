# systemd-ollama-override.conf
# ---------------------------------------------------------------------------
# Plantilla de referencia para /etc/systemd/system/ollama.service.d/override.conf
# (Linux con systemd). Ver Capítulo 5, "Configuración avanzada para entornos
# de múltiples usuarios".
#
# Instalación manual:
#   sudo systemctl edit ollama
#   (pega el contenido de la sección [Service] de abajo, ajustando valores)
#   sudo systemctl daemon-reload
#   sudo systemctl restart ollama
#
# Instalación automática: usa scripts/configure_multiuser_ollama.sh
# ---------------------------------------------------------------------------
[Service]
# Expone la API en todas las interfaces de red (accesible desde el
# laboratorio). Restringe por firewall si tu política institucional lo exige.
Environment="OLLAMA_HOST=0.0.0.0:11434"

# Directorio compartido de modelos: evita que cada usuario descargue su
# propia copia de cada modelo.
Environment="OLLAMA_MODELS=/shared/models"

# --- Descomenta y ajusta estas dos líneas SOLO si tu red institucional
#     exige un proxy corporativo saliente ---
# Environment="HTTP_PROXY=http://proxy.universidad.edu:8080"
# Environment="HTTPS_PROXY=http://proxy.universidad.edu:8080"
